server.port=8081

oracle.url=jdbc:oracle:thin:@//localhost:1521/ORCLCDB
oracle.user=fasttag_user
oracle.password=fasttag_pass

spring.redis.host=localhost
spring.redis.port=6379

cache.refresh.interval-ms=600000
cache.toll.key-prefix=toll
cache.vehicle.key-prefix=vehicle
cache.toll.last-sync-key=toll:last_sync
cache.vehicle.last-sync-key=vehicle:last_sync

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
